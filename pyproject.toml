[project]
name = "traceforge-ai"
version = "1.3.2"
description = "A black-box recorder for AI coding agents and shell commands."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TraceForge Contributors" }]
keywords = ["ai-agent", "debugging", "devtools", "cli", "git", "trace", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Debuggers",
]

[project.scripts]
traceforge = "traceforge.cli:main"

[tool.setuptools]
packages = ["traceforge"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
